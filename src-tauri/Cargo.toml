[package]
name = "ai-transkrypt"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "ai_transkrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
whisper-rs = { version = "0.16.0" }
symphonia = { version = "0.6.1", features = ["mp3", "aac", "flac", "ogg", "wav", "pcm", "isomp4"] }
anyhow = "1.0.105"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
printpdf = "0.12.14"
rubato = "0.15"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["stream", "rustls"] }
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
