[package]
name = "ai-transkrypt"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_transkrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
symphonia = { version = "0.6.1", features = ["mp3", "aac", "flac", "ogg", "wav", "pcm", "isomp4"] }
hound = "3.5.1"
anyhow = "1.0.105"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
num_cpus = "1.17.0"
printpdf = "0.12.14"
rubato = "0.15"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["stream", "rustls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
